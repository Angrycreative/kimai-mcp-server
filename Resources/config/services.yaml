services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    KimaiPlugin\McpServerBundle\:
        resource: '../../*'
        exclude:
            - '../../DependencyInjection/'
            - '../../Migrations/'
            - '../../Resources/'
            - '../../Server/ToolHandlerAdapter.php'
            - '../../Server/DoctrineSessionStore.php'
            - '../../Server/LoggerBridge.php'
            - '../../tests/'
            - '../../tools/'
            - '../../vendor-prefixed/'

    KimaiPlugin\McpServerBundle\Server\ServerFactory:
        arguments:
            $tools: !tagged_iterator kimai_mcp_server.tool
