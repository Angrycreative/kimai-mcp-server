services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    KimaiPlugin\McpServerBundle\:
        resource: '../../*'
        exclude:
            - '../../DependencyInjection/'
            - '../../Migrations/'
            - '../../Resources/'
            - '../../Server/ToolHandlerAdapter.php'
            - '../../Server/DoctrineSessionStore.php'
            - '../../Server/LoggerBridge.php'
            - '../../tests/'
            - '../../tools/'
            - '../../vendor-prefixed/'

    KimaiPlugin\McpServerBundle\Tool\ToolRegistry:
        arguments:
            $tools: !tagged_iterator kimai_mcp_server.tool

    KimaiPlugin\McpServerBundle\Category\TimeCategories:
        arguments:
            $providers: !tagged_iterator kimai_mcp_server.time_category_provider

    KimaiPlugin\McpServerBundle\Capacity\WorkingCapacity:
        arguments:
            $providers: !tagged_iterator kimai_mcp_server.working_capacity_provider

    KimaiPlugin\McpServerBundle\Budget\RecurringBudgets:
        arguments:
            $providers: !tagged_iterator kimai_mcp_server.recurring_budget_provider
